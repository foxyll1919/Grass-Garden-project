const GSP=new Map();
function gsprite(k,soft){const key=k+'|'+soft;if(GSP.has(key))return GSP.get(key);
 const pt=parts(k===2?1:0,k>=3?1:0,k===1||k===3||k===5?1:0,k>3?k-3:0),N=SW*SH,Q=new Float32Array(N),O=new Int8Array(N).fill(-1),UY=new Float32Array(N);

const unit=y=>cl(.3*R*(y-horizon)/camH,9,60);
function upd(dt){gT+=dt;const u=unit(py);

  if(tgt){const dx=tgt.x-px,dy=tgt.y-py;const d0=Math.hypot(dx,dy);if(d0>3.2*u){if(Math.abs(dx)>4)face=dx>0?1:-1;quiet=0;if(d0>12*u&&!RM){st='fly';stT=0;vx=vy=0;alt=0}else{st='crouch';stT=0}return}}quiet+=dt}
 else if(st==='crouch'){stT+=dt;if(stT>=(RM?0:.07)){const dx=tgt.x-px,dy=tgt.y-py,d=Math.hypot(dx,dy)||1,L=Math.min(3.4*u,d-1.6*u);

 else if(st==='hop'){stT+=dt;hu=Math.min(1,stT/hop.D);px=lp(hop.x0,hop.x1,hu);py=lp(hop.y0,hop.y1,hu);if(hu>=1){st='land';stT=0}}
 else if(st==='fly'){stT+=dt;fl+=dt;const dx=tgt.x-px,dy=tgt.y-py,d=Math.hypot(dx,dy)||1,sp=Math.min(11*u,Math.max(0,d-1.6*u)*2.4),k=Math.min(1,dt*3.5);

  const near=d<5*u,ta=near?0:1.7*u+.25*u*Math.sin(gT*5);alt+=(ta-alt)*Math.min(1,dt*(near?3.2:2.2));
  if(near&&alt<.12*u){alt=0;st='land';stT=0;vx=vy=0}}
 else{stT+=dt;if(stT>=(RM?0:.06)){st='idle';anT=0}}}

 const u=unit(py),sc=u/PPU,r=(py-horizon)/camH/(F/(FZ+D0)),soft=r<.6||r>1.7,hp=st==='hop',k=st==='fly'?(Math.floor(fl*16)%2?5:4):hp?3:st==='crouch'||st==='land'?2:an,
  ar=st==='fly'?alt:hp?4*hop.h*hu*(1-hu):0,ang=st==='fly'?-.25+vy/(11*u)*.3+.06*Math.sin(gT*14):hp&&!RM?-.5*(1-2*hu):0,fade=RM?1:cl((gT-1.2)/.6,0,1),lift=Math.min(1,ar/u),w=2.4*u*(1-.35*lift);
